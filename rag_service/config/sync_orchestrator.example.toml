[orchestrator]
# Host path that maps to /data/uploads inside this rag_service instance.
ingest_root = "/srv/ops/universe_rag/uploads"
ingest_live_subdir = "universe_live"

# UniverseSimulation RAG admin endpoint.
admin_base_url = "http://127.0.0.1:8103"
admin_api_key_env = "UNIVERSE_ADMIN_API_KEY"
request_timeout_sec = 120
fetch_coverage_actions = true

include_default = ["**/*.md", "**/*.markdown", "**/*.txt", "**/*.csv", "**/*.html", "**/*.htm", "**/*.pdf", "**/*.docx"]
exclude_default = ["**/.git/**", "**/.venv/**", "**/node_modules/**", "**/__pycache__/**", "**/.build/**", "**/.swiftpm/**"]

[[source]]
name = "UniverseSimulationResearchReport"
repo_path = "/srv/ops/repos/UniverseSimulation"
source_type = "universe_argumentation"
target_subdir = "UniverseSimulation/research_report"
include = ["Documentation/grundig-research-rapport-16.md", "Documentation/v16o_v16s_direction_and_execution_report.md", "Documentation/v16t_next_direction_assessment.md", "Documentation/v16u_next_direction_assessment.md", "Documentation/v16v_next_direction_assessment.md", "Documentation/v16v_units_of_action_energy_temperature_hypothesis.md", "Documentation/v16w_next_direction_assessment.md", "Documentation/v16w_interpretation_audit.md", "Documentation/v16x_next_direction_assessment.md", "Documentation/v16x_interpretation_audit.md", "Documentation/v16y_next_direction_assessment.md", "Documentation/v16y_interpretation_audit.md", "Documentation/v16y_postrun_start_separation_audit.md", "rag_service/docs/UNIVERSE_ARGUMENTATION_MAP.md"]

[[source]]
name = "UniverseSimulationProjectStatus"
repo_path = "/srv/ops/repos/UniverseSimulation"
source_type = "universe_status"
target_subdir = "UniverseSimulation/status"
include = ["README.md", "PROJECT_CONTEXT_LIVE.md", "PROJECT_HISTORY_INDEX.md", "rag_service/docs/UNIVERSE_RAG_STATUS.md", "rag_service/docs/UNIVERSE_CORPUS_PLAN.md"]

