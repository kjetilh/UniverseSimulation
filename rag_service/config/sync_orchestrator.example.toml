[orchestrator]
# Host path that maps to /data/uploads inside this rag_service instance.
ingest_root = "/srv/ops/universe_rag/uploads"
ingest_live_subdir = "universe_live"

# UniverseSimulation RAG admin endpoint.
admin_base_url = "http://127.0.0.1:8103"
admin_api_key_env = "UNIVERSE_ADMIN_API_KEY"
request_timeout_sec = 120
fetch_coverage_actions = true

include_default = ["**/*.md", "**/*.markdown", "**/*.txt", "**/*.csv", "**/*.html", "**/*.htm", "**/*.pdf", "**/*.docx"]
exclude_default = ["**/.git/**", "**/.venv/**", "**/node_modules/**", "**/__pycache__/**", "**/.build/**", "**/.swiftpm/**"]

[[source]]
name = "UniverseSimulationResearchReport"
repo_path = "/srv/ops/repos/UniverseSimulation"
source_type = "universe_argumentation"
target_subdir = "UniverseSimulation/research_report"
include = ["Documentation/grundig-research-rapport-16.md", "Documentation/v16o_v16s_direction_and_execution_report.md", "rag_service/docs/UNIVERSE_ARGUMENTATION_MAP.md"]

[[source]]
name = "UniverseSimulationProjectStatus"
repo_path = "/srv/ops/repos/UniverseSimulation"
source_type = "universe_status"
target_subdir = "UniverseSimulation/status"
include = ["README.md", "PROJECT_CONTEXT_LIVE.md", "PROJECT_HISTORY_INDEX.md", "rag_service/docs/UNIVERSE_RAG_STATUS.md", "rag_service/docs/UNIVERSE_CORPUS_PLAN.md"]

[[source]]
name = "UniverseSimulationExperimentEvidence"
repo_path = "/srv/ops/repos/UniverseSimulation"
source_type = "universe_experiments"
target_subdir = "UniverseSimulation/experiments"
include = [
  "Documentation/v16h_fresh_rate_logged_mechanism_holdout.md",
  "Documentation/v0_16h_operativ_anbefaling.md",
  "Documentation/v16i_causal_interval_abundance_gate.md",
  "Documentation/v0_16i_operativ_anbefaling.md",
  "Documentation/v16j_interval_strict_null_gate.md",
  "Documentation/v16j_interpretation_audit.md",
  "Documentation/v0_16j_operativ_anbefaling.md",
  "Documentation/v16j_gate_evaluation.csv",
  "Documentation/v16j_local_strict_null_gate.csv",
  "Documentation/v16j_calibration_transfer.csv",
  "Documentation/v16m_qualified_sampler_fresh_holdout.md",
  "Documentation/v16m_effect_existence_gate.csv",
  "Documentation/v16m_gate_evaluation.csv",
