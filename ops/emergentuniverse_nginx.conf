server {
    server_name emergentuniverse.haven.digipomps.org;

    root /var/www/emergentuniverse;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.csv$ {
        default_type text/csv;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ~* \.json$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|txt|html)$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/emergentuniverse.haven.digipomps.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/emergentuniverse.haven.digipomps.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = emergentuniverse.haven.digipomps.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name emergentuniverse.haven.digipomps.org;
    return 404; # managed by Certbot
}
